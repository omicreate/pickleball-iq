<script>
// 公開URLとフォロー先が決まったらここに入れる(空なら表示しない)
const SITE = "https://omicreate.github.io/pickleball-iq/";
const SISTER_URL = "https://omicreate.github.io/pickle-asobi/?src=pb_iq_cross";
const IG_URL = "https://www.instagram.com/pickleballiq_jp/";
const TH_URL = "https://www.threads.net/@pickleballiq_jp";
const typeUrl = k => SITE + "t/" + k + "/?src=share";

// ---- 匿名の回数だけを数える(Apps Script→スプレッドシート。姉妹アプリと同じ受け口) ----
// 送るのは「できごと(open/start/finish)・タイプ・さくっと/ガチ・リンクの印(?src=)・版」だけ。回答の中身・名前・端末IDは送らない。
// 公開URL以外(手元・試遊)では送らない。ブラウザの「追跡しない」(DNT/GPC)がオンのとき、「プライバシーと計測」で「送らない」を選んだ端末からも送らない。
// 他社の解析ツール・広告タグは使わない。計測の項目を足すときは、先に「プライバシーと計測」の説明を直す。
const COUNTER_URL = "https://script.google.com/macros/s/AKfycbwZ7leA3EVJYlJR3Ia7GLGFxui8NBSy1Npc-fDVkXUHPiEc4b_LM1T-G9w6tr88zXA/exec";
const APP_V = "1.0";
const ROOT = "%%ROOT%%";
const OFF_KEY = "pbiq-track-off", SEEN_KEY = "pbiq-privacy-seen";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* 保存できなくても続ける */ } }
};
const trackOff = () => store.get(OFF_KEY) === "1";
const counter = (() => {
  let src = "", opened = false;
  const clean = v => v && /^[A-Za-z0-9_-]{1,40}$/.test(v) ? v : "";
  try {
    const u = new URL(location.href);
    const fromUrl = clean(u.searchParams.get("src"));
    if (u.searchParams.has("src")) { u.searchParams.delete("src"); history.replaceState(history.state, "", u.pathname + u.search + u.hash); }
    if (fromUrl) sessionStorage.setItem("pbiq:src", fromUrl);
    src = fromUrl || clean(sessionStorage.getItem("pbiq:src"));
  } catch (e) { src = ""; }
  const on = () => {
    try {
      if (location.hostname !== new URL(SITE).hostname) return false;
      if (trackOff()) return false;
      return !(navigator.doNotTrack === "1" || navigator.globalPrivacyControl === true);
    } catch (e) { return false; }
  };
  const send = (ev, extra) => {
    if (!on()) return;
    try {
      const q = new URLSearchParams(Object.assign({ app: "pickleball-iq", ev, v: APP_V }, src ? { src } : {}, extra || {}));
      const url = COUNTER_URL + "?" + q;
      if (navigator.sendBeacon && navigator.sendBeacon(url)) return;
      fetch(url, { mode: "no-cors", credentials: "omit", cache: "no-store", keepalive: true, referrerPolicy: "no-referrer" }).catch(() => {});
    } catch (e) { /* 送れなくても診断は続ける */ }
  };

function rankOf(v){return v>=80?"S":v>=60?"A":v>=40?"B":v>=20?"C":"D";}
function protoPct(k){const [a,b]=k.split("-");const p={};AXES.forEach((x,i)=>p[x]=28+((i*17+a.charCodeAt(0))%24));p[a]=90;p[b]=72;return p;}

// ===== マーク:外形と色=1位の項目、中の記号=2位の項目 =====
function starPts(n,r1,r2,cx,cy){let p=[];for(let i=0;i<n*2;i++){const r=i%2?r2:r1,t=Math.PI*i/n;p.push((cx+r*Math.sin(t)).toFixed(1)+","+(cy-r*Math.cos(t)).toFixed(1));}return p.join(" ");}
function polyPts(n,r,cx,cy,rot){let p=[];for(let i=0;i<n;i++){const t=2*Math.PI*i/n+rot;p.push((cx+r*Math.sin(t)).toFixed(1)+","+(cy-r*Math.cos(t)).toFixed(1));}return p.join(" ");}
const SHAPE={
  pow:(f,s)=>`<polygon points="${starPts(10,57,41,60,60)}" fill="${f}" stroke="${s}" stroke-width="6" stroke-linejoin="round"/>`,
  sta:(f,s)=>`<rect x="9" y="9" width="102" height="102" rx="26" fill="${f}" stroke="${s}" stroke-width="6"/>`,
  trk:(f,s)=>`<polygon points="60,3 117,60 60,117 3,60" fill="${f}" stroke="${s}" stroke-width="6" stroke-linejoin="round"/>`,
  luv:(f,s)=>`<circle cx="60" cy="60" r="54" fill="${f}" stroke="${s}" stroke-width="6"/>`,
  nrd:(f,s)=>`<polygon points="${polyPts(6,58,60,60,Math.PI/6)}" fill="${f}" stroke="${s}" stroke-width="6" stroke-linejoin="round"/>`,
  vib:(f,s)=>`<polygon points="${starPts(14,57,48,60,60)}" fill="${f}" stroke="${s}" stroke-width="6" stroke-linejoin="round"/>`
};
const GLYPH={
  pow:c=>`<polygon points="58,6 22,58 46,58 38,96 78,40 54,40 66,6" fill="${c}"/>`,
  sta:c=>`<path d="M50 50 C40 30,12 30,12 50 C12 70,40 70,50 50 C60 30,88 30,88 50 C88 70,60 70,50 50Z" fill="none" stroke="${c}" stroke-width="11" stroke-linejoin="round"/>`,
  trk:c=>`<path d="M8 50 Q50 12 92 50 Q50 88 8 50Z" fill="none" stroke="${c}" stroke-width="10" stroke-linejoin="round"/><circle cx="50" cy="50" r="14" fill="${c}"/>`,
  luv:c=>`<path d="M50 88 C16 65 8 46 18 31 C28 17 46 19 50 36 C54 19 72 17 82 31 C92 46 84 65 50 88Z" fill="${c}"/>`,
  nrd:c=>`<circle cx="42" cy="42" r="23" fill="none" stroke="${c}" stroke-width="11"/><line x1="59" y1="59" x2="86" y2="86" stroke="${c}" stroke-width="14" stroke-linecap="round"/>`,
  vib:c=>`<line x1="66" y1="14" x2="66" y2="70" stroke="${c}" stroke-width="10" stroke-linecap="round"/><path d="M66 14 Q86 18 88 40" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round"/><ellipse cx="48" cy="72" rx="19" ry="14" fill="${c}"/>`
};
function markInner(a,b){
  return `<g transform="translate(6 6)">${SHAPE[a]("var(--navy)","var(--navy)")}</g>${SHAPE[a](AX[a].color,"var(--navy)")}<g transform="translate(26 26) scale(.68)">${GLYPH[b](AX[a].ink)}</g>`;
}
function mark(k){const [a,b]=k.split("-");return `<svg viewBox="-4 -4 134 134" role="img" aria-label="${pn(k)}のマーク">${markInner(a,b)}</svg>`;}
function axisIcon(a){return `<svg viewBox="-4 -4 134 134" aria-hidden="true">${SHAPE[a](AX[a].color,"var(--navy)")}<g transform="translate(26 26) scale(.68)">${GLYPH[a](AX[a].ink)}</g></svg>`;}

// ===== レーダー =====
function radar(pct){
  const cx=110,cy=110,R=76;
  const pt=(i,r)=>{const t=-Math.PI/2+i*Math.PI/3;return [(cx+r*Math.cos(t)).toFixed(1),(cy+r*Math.sin(t)).toFixed(1)];};
  const ring=f=>AXES.map((_,i)=>pt(i,R*f).join(",")).join(" ");
  const v=a=>R*Math.max(.06,pct[a]/100);
  const data=AXES.map((a,i)=>pt(i,v(a)).join(",")).join(" ");
  const labels=AXES.map((a,i)=>{const [x,y]=pt(i,R+22);return `<text x="${x}" y="${(+y+5).toFixed(1)}" text-anchor="middle" font-family="Zen Maru Gothic,sans-serif" font-weight="900" font-size="13" fill="var(--navy)">${AX[a].jp}</text>`}).join("");
  return `<svg class="radar" viewBox="0 0 220 220" role="img" aria-label="パラメータ:${AXES.map(a=>AX[a].jp+pct[a]).join("、")}">
    <polygon points="${ring(1)}" fill="var(--cloud)" stroke="var(--navy)" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="${ring(.66)}" fill="none" stroke="var(--navy)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polygon points="${ring(.33)}" fill="none" stroke="var(--navy)" stroke-width="1.5" stroke-dasharray="4 4"/>
    ${AXES.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="var(--navy)" stroke-width="1.5"/>`).join("")}
    <g class="grow"><polygon points="${data}" fill="var(--flamingo)" fill-opacity=".85" stroke="var(--navy)" stroke-width="3.5" stroke-linejoin="round"/>
    ${AXES.map((a,i)=>{const [x,y]=pt(i,v(a));return `<circle cx="${x}" cy="${y}" r="5.5" fill="${AX[a].color}" stroke="var(--navy)" stroke-width="2.5"/>`}).join("")}</g>
    ${labels}</svg>`;
}

    <h2>数えてよいか</h2>
    <div class="pv-choice" role="radiogroup" aria-label="計測に送るか">
      <button type="button" class="chip" role="radio" id="pvon" aria-checked="${!off}">送る</button>
      <button type="button" class="chip" role="radio" id="pvoff" aria-checked="${off}">送らない</button>
    </div>
    <p class="pv-state" role="status" id="pvstate"></p>
    <p class="pv-who">運営:omicreate(@pickleballiq_jp)</p>
  </div>`;
  const state=document.getElementById("pvstate"),bOn=document.getElementById("pvon"),bOff=document.getElementById("pvoff");
  const show=o=>{
    bOn.setAttribute("aria-checked",String(!o));bOff.setAttribute("aria-checked",String(o));
    state.textContent=(o?"「送らない」になっています。この端末からは送りません。":"「送らない」を選ぶと、この端末からは送らなくなります。")+"ブラウザの「追跡しない」設定がオンのときも送りません。";
  };
  const choose=o=>{store.set(OFF_KEY,o?"1":null);show(o);};
  bOn.onclick=()=>choose(false);bOff.onclick=()=>choose(true);show(off);
  document.getElementById("pvback").onclick=e=>{if(window.__TYPE__)return;e.preventDefault();intro();window.scrollTo({top:0});};
  markSeen();window.scrollTo({top:0});
}

// ---- はじめて開いたときだけ、計測していることを一行で知らせる(閉じるか説明を開いたら、次からは出さない) ----
function markSeen(){store.set(SEEN_KEY,"1");const n=document.getElementById("pvnotice");if(n)n.remove();}
function notice(){
  if(store.get(SEEN_KEY)==="1")return;
  const n=document.createElement("aside");
  n.id="pvnotice";n.className="pv-notice";n.setAttribute("aria-label","計測のお知らせ");
  n.innerHTML=`<p>このアプリは、開いた回数と診断の回数だけを数えています。<a href="${ROOT}#privacy" data-privacy>詳しく・送らない</a></p><button type="button" class="pv-x" aria-label="お知らせを閉じる">×</button>`;
  n.querySelector(".pv-x").onclick=markSeen;
  n.querySelector("a").onclick=e=>{markSeen();if(window.__TYPE__)return;e.preventDefault();privacy();};
  document.body.appendChild(n);
}

const h=window.__TYPE__||decodeURIComponent(location.hash.slice(1));
counter.open(T[h]?h:"");
if(h==="privacy")privacy();else T[h]?result(h):intro();
notice();
addEventListener("hashchange",()=>{if(!window.__TYPE__&&location.hash==="#privacy")privacy();});
